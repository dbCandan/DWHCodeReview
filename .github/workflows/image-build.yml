name: Build & Push
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dwhcodereview-image-publication
  cancel-in-progress: false
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {persist-credentials: false}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The deployment pipeline waits for <slug>-backend:<sha> and <slug>-frontend:<sha>. The app is one
      # image (API + UI), so the same build is published under both names; helm deploys -backend.
      - name: Compute publication coordinates
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "BACKEND=ghcr.io/$owner/dwhcodereview-backend" >> "$GITHUB_ENV"
          echo "FRONTEND=ghcr.io/$owner/dwhcodereview-frontend" >> "$GITHUB_ENV"
          echo "DATE_TAG=$(date -u +'%Y%m%d-%H%M%S')" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.BACKEND }}:latest
            ${{ env.BACKEND }}:${{ env.DATE_TAG }}
            ${{ env.BACKEND }}:${{ env.SHORT_SHA }}
            ${{ env.BACKEND }}:${{ github.sha }}
            ${{ env.FRONTEND }}:latest
            ${{ env.FRONTEND }}:${{ env.DATE_TAG }}
            ${{ env.FRONTEND }}:${{ env.SHORT_SHA }}
            ${{ env.FRONTEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
