detectors:
  - id: detector:bilgi-guvenligi/sec-001
    source_refs:
      - governance-source:desktop-agents/information-security/policy.yaml#rule/SEC-001
    control_refs:
      - control:INFOSEC-102
    severity: critical
    reason: "Kodda bir parola, gizli anahtar ya da erişim anahtarı doğrudan yazılmış olabilir. Sırlar koda gömülmez; kasadan (vault) ya da yapılandırmadan okunur."
    scan_group: adjudication
    evidence_kind: deterministic-check
    standard_refs:
      - standard_id: ISO-IEC-27001
        control_id: A.5.17
        version: "2022"
        mapping_status: baseline-unverified
      - standard_id: ISO-IEC-27001
        control_id: A.8.28
        version: "2022"
        mapping_status: baseline-unverified
    implementation:
      kind: regex
      engine: python-re
      pattern: "(?i)\\b(api[_-]?key|apikey|secret|password|passwd|token|pwd|auth_key|access_key)['\"]?\\s*(?::\\s*[\\w\\[\\],. ]+)?\\s*[:=]\\s*['\"][^'\"]{8,}['\"]"
      flags: []
    limitations: Kaynak tarafından sağlanan tespit mantığı korunur; ancak kalibrasyon tamamlanmamıştır ve tek başına çalışma zamanı etkisini veya politika uyumluluğunu kanıtlayamaz.
    implementation_status: calibration-pending
    projection_status: not-projectable
    runtime_admission: not-admitted
    lifecycle: draft
  - id: detector:bilgi-guvenligi/sec-002
    source_refs:
      - governance-source:desktop-agents/information-security/policy.yaml#rule/SEC-002
    control_refs:
      - control:INFOSEC-102
    severity: critical
    reason: "Kodda AWS erişim anahtarı kimliğine benzeyen bir değer var. Bulut erişim anahtarları koda yazılmaz; kasadan ya da ortam değişkeninden okunur."
    scan_group: adjudication
    evidence_kind: deterministic-check
    standard_refs:
      - standard_id: ISO-IEC-27001
        control_id: A.5.17
        version: "2022"
        mapping_status: baseline-unverified
    implementation:
      kind: regex
      engine: python-re
      pattern: "AKIA[0-9A-Z]{16}"
      flags: []
    limitations: Kaynak tarafından sağlanan tespit mantığı korunur; ancak kalibrasyon tamamlanmamıştır ve tek başına çalışma zamanı etkisini veya politika uyumluluğunu kanıtlayamaz.
