    lifecycle: draft
  - id: detector:bilgi-guvenligi/sec-003
    source_refs:
      - governance-source:desktop-agents/information-security/policy.yaml#rule/SEC-003
    control_refs:
      - control:INFOSEC-102
    severity: critical
    reason: "Kodda özel anahtar (PEM) bloğu var. Özel anahtar depoya girerse onu ele geçiren kişi bu anahtarla kimlik doğrulayabilir ya da şifreli veriyi çözebilir."
    scan_group: adjudication
    evidence_kind: deterministic-check
    standard_refs:
      - standard_id: ISO-IEC-27001
        control_id: A.8.24
        version: "2022"
        mapping_status: baseline-unverified
    implementation:
      kind: regex
      engine: python-re
      pattern: "-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----"
      flags: []
    limitations: Kaynak tarafından sağlanan tespit mantığı korunur; ancak kalibrasyon tamamlanmamıştır ve tek başına çalışma zamanı etkisini veya politika uyumluluğunu kanıtlayamaz.
