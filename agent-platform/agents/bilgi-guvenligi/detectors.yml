        control_id: A.5.34
        version: "2022"
        mapping_status: baseline-unverified
      - standard_id: KVKK-6698
        control_id: "12/1"
        version: "2024-06-01"
        mapping_status: baseline-unverified
    implementation:
      kind: regex
      engine: python-re
      pattern: "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}"
      flags: []
    limitations: Kaynak tarafından sağlanan tespit mantığı korunur; ancak kalibrasyon tamamlanmamıştır ve tek başına çalışma zamanı etkisini veya politika uyumluluğunu kanıtlayamaz.
    implementation_status: calibration-pending
    projection_status: not-projectable
    runtime_admission: not-admitted
    lifecycle: draft
  - id: detector:bilgi-guvenligi/sec-006
    source_refs:
      - governance-source:desktop-agents/information-security/policy.yaml#rule/SEC-006
    control_refs:
      - control:INFOSEC-102
    severity: medium
    evidence_kind: deterministic-check
    standard_refs: []
    implementation:
      kind: regex
      engine: python-re
      pattern: "http://[^\\s'\"]*(token|key|password|auth)="
      flags: []
    limitations: Kaynak tarafından sağlanan tespit mantığı korunur; ancak kalibrasyon tamamlanmamıştır ve tek başına çalışma zamanı etkisini veya politika uyumluluğunu kanıtlayamaz.
    implementation_status: calibration-pending
    projection_status: not-projectable
    runtime_admission: not-admitted
    lifecycle: draft
  - id: detector:bilgi-guvenligi/sec-007
    source_refs:
      - governance-source:desktop-agents/information-security/policy.yaml#rule/SEC-007
    control_refs:
      - control:INFOSEC-102
    severity: critical
    reason: "Veritabanı bağlantı cümlesinin içine parola yazılmış. Kurum standardına göre parolalar yalnız kasadan ya da yapılandırmadan okunur."
    scan_group: adjudication
    evidence_kind: deterministic-check
    standard_refs:
      - standard_id: ISO-IEC-27001
        control_id: A.5.17
        version: "2022"
        mapping_status: baseline-unverified
    implementation:
      kind: regex
      engine: python-re
      pattern: "(?i)(server|host|data source)\\s*=\\s*[^;']+;[^'\"]password\\s=\\s*[^;'\"]{3,}"
      flags: []
    limitations: Kaynak tarafından sağlanan tespit mantığı korunur; ancak kalibrasyon tamamlanmamıştır ve tek başına çalışma zamanı etkisini veya politika uyumluluğunu kanıtlayamaz.
    implementation_status: calibration-pending
    projection_status: not-projectable
    runtime_admission: not-admitted
    lifecycle: draft
  - id: detector:bilgi-guvenligi/sec-008
    source_refs:
      - governance-source:desktop-agents/information-security/policy.yaml#rule/SEC-008
    control_refs:
      - control:INFOSEC-102
    severity: critical
    reason: "Parola, token ya da gizli anahtar taşıyan bir alan doğrudan log (kayıt) çağrısına veriliyor. Bu alanlar hiçbir zaman loglanmaz; önce temizleyiciden geçer."
    scan_group: adjudication
    evidence_kind: deterministic-check
    standard_refs:
      - standard_id: ISO-IEC-27001
        control_id: A.5.17
        version: "2022"
        mapping_status: baseline-unverified
      - standard_id: ISO-IEC-27001
        control_id: A.8.15
        version: "2022"
        mapping_status: baseline-unverified
    implementation:
      kind: regex
      engine: python-re
      pattern: "log(ger)?\\.\\w+\\([^)]*\\b(password|token|secret|api_key)\\b"
      flags: []
    limitations: Kaynak tarafından sağlanan tespit mantığı korunur; ancak kalibrasyon tamamlanmamıştır ve tek başına çalışma zamanı etkisini veya politika uyumluluğunu kanıtlayamaz.
    implementation_status: calibration-pending
    projection_status: not-projectable
    runtime_admission: not-admitted
    lifecycle: draft
  - id: detector:bilgi-guvenligi/sec-009
    source_refs:
      - governance-source:desktop-agents/information-security/policy.yaml#rule/SEC-009
    control_refs:
      - control:INFOSEC-102
    severity: critical
    reason: "Kodda sabit yazılmış bir IP adresi var. Ortama özel bir adres sızabilir; adres yapılandırmadan ya da DNS kaydından okunmalıdır."
    scan_group: adjudication
    evidence_kind: deterministic-check
    standard_refs: []
    implementation:
      kind: regex
      engine: python-re
      pattern: "\\b(?!0\\.0\\.0\\.0\\b)(?!127\\.)(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\\b"
      flags: []
      resolution_ref: resolution:sec009-loopback-exemption
      profile_ref: technology-profile.yml#security.loopback_is_network_exposure
      exempt_addresses:
        - 127.0.0.0/8
        - "::1"
        - localhost
      missing_or_invalid_input: BLOCKED_INCOMPLETE
    limitations: Loopback (127.0.0.0/8, ::1, localhost) ağ maruziyeti sayılmaz ve eşleşmez; diğer sabit IPv4 adresleri kritik bulgu adayıdır. 0.0.0.0 farkı ve katı sonuç envanteri sahip kararını bekler. Belirtim yürütücü, kalibrasyon veya çalışma zamanı kabulü kanıtı değildir.
    implementation_status: calibration-pending
    projection_status: not-projectable
    runtime_admission: not-admitted
    lifecycle: draft
