# Kritik ihlal bildirimi politikası. Davranışın sahibi:
# specs/agent-platform/PRDs/012-critical-violation-notification-to-some-and-person/PRD.md
# Hangi olayın kritik sayıldığı, SOME kanalı, kişi e-postası, süreler, tavanlar ve metinler
# yalnız bu dosyadadır; kodda sabit liste yoktur.
schema_version: "1.0"
kind: CriticalViolationNotificationPolicy
metadata:
  id: policy:critical-violation-notification
  version: 1.1.0
  owner: team:ai-governance

verification:
  # Yalnız bu sonuçtaki kayıt kişiye e-posta üretir.
  trusted_results: [verified]
  # Bu sonuçtaki kayıt sınıflandırılmaz; SOME'ye yalnız record-integrity-broken gider.
  integrity_results: [gap, mismatch, rollback]

# Kayda uyan ilk satır seçilir. ISO/KVKK dayanağı bu dosyada değil, olaya yol açan detektörün
# paketindeki standard_refs alanındadır (Agent Platform Yetenek 009).
rules:
  - id: prompt-blocked-secret
    source: prompt-ingress
    decision: block
    detector_classes: [labelled-secret, cloud-access-key, private-key]
    some: immediate
    person: true
  - id: prompt-blocked-personal-data
    source: prompt-ingress
    decision: block
    detector_classes: [tckn, iban, payment-card]
    some: immediate
    person: true
  - id: review-hard-fail
    source: review-decision
    decision: HARD-FAIL
    some: immediate
    person: true
  - id: review-security-veto
    source: review-decision
    decision: FAIL
    reason_codes: [AGG_SECURITY_CRITICAL_VETO]
    some: daily-digest
    person: true
  - id: record-integrity-broken
    source: collector-verification
    some: immediate
    person: false
  - id: event-storm
    source: notification-volume
    some: immediate
    person: false

limits:
  duplicate_window_hours: 24
  person_emails_per_day: 3
  storm_events_per_hour: 50
  some_fallback_after_minutes: 30
  some_deadline_minutes: 5
  person_deadline_minutes: 15
  worker_interval_seconds: 30
  retry_initial_seconds: 60
  retry_max_seconds: 900
  retry_max_attempts: 8
  directory_refresh_minutes: 60

templates:
  person:
    prompt-blocked-secret:
      subject: Gizli anahtar içeren mesajın gönderilmedi
      what_happened: >-
        Yapay zekâ asistanına yazdığın bir mesajda parola, erişim anahtarı ya da özel anahtar
        (sistemlere giriş için kullanılan gizli bilgi) bulundu. Mesaj asistana gönderilmeden
        durduruldu.
      why_it_matters: >-
        Gizli bilgi bir yapay zekâ hizmetine ya da bir kayda girerse başkası o sisteme senin
        yerine girebilir.
      what_to_do: >-
        Bu anahtarı ya da parolayı hemen değiştir; durdurulmuş olsa da artık güvenli sayma.
        Gizli bilgiyi mesaja yazma, asistana yalnız nerede durduğunu söyle. Sorun olursa SOME
        ekibine bu iletideki kayıt numarasıyla yaz.
    prompt-blocked-personal-data:
      subject: Kişisel veri içeren mesajın gönderilmedi
      what_happened: >-
        Yapay zekâ asistanına yazdığın bir mesajda T.C. kimlik numarası, IBAN ya da kart numarası
        bulundu. Mesaj asistana gönderilmeden durduruldu.
      why_it_matters: >-
        Bu numaralar müşterilerin ya da çalışanların kişisel verisidir. Bir yapay zekâ hizmetine
        gönderilmeleri kurum kurallarına ve kişisel verilerin korunması yükümlülüğüne aykırıdır.
      what_to_do: >-
        Gerçek numara yerine uydurma deneme verisi kullan. Numaranın nereden geldiğini kontrol et;
        gerçek bir kişinin verisi bilgisayarında açıkta duruyorsa SOME ekibine bu iletideki kayıt
        numarasıyla yaz.
    review-hard-fail:
      subject: Değişikliğin kesin bir kural ihlali yüzünden kaydedilemedi
      what_happened: >-
        Değişikliğin kaydedilmeden önce yapılan denetimde (yönetilen inceleme), kodu kesin
        kurallarla tarayan adım bir ihlal buldu. Karar HARD-FAIL (kesin kural ihlali yüzünden
        kaldı) oldu ve değişiklik kaydedilmedi.
      why_it_matters: >-
        Bu kurallar güvenlik açığına ya da veri sızıntısına yol açan kalıpları yakalar. Değişiklik
        bu hâliyle ana koda giremez.
      what_to_do: >-
        Aşağıdaki dosya ve satırı düzelt, sonra incelemeyi yeniden başlat. Bulgunun yanlış
        olduğunu düşünüyorsan SOME ekibine bu iletideki kayıt numarasıyla yaz.
    review-security-veto:
      subject: Değişikliğinde kritik bir güvenlik bulgusu var
      what_happened: >-
        Değişikliğin kaydedilmeden önce yapılan denetimde güvenlik uzmanı ajanlardan biri kritik
        bir bulgu buldu. Karar FAIL (kaldı) oldu ve değişiklik kaydedilmedi.
      why_it_matters: >-
        Kritik güvenlik bulgusu, düzeltilmezse saldırıya ya da veri sızıntısına açık kapı
        bırakabilir. Bu bulguyu yapay zekâ verdiği için SOME ekibi bunu günlük özetle görür.
      what_to_do: >-
        Aşağıdaki dosya ve satırı incele, sorunu düzeltip incelemeyi yeniden başlat. Bulgunun
        yanlış olduğunu düşünüyorsan SOME ekibine bu iletideki kayıt numarasıyla yaz.
  some_fallback:
    subject: Kritik ihlal bildirimi
    intro: >-
      Olay takip sistemine ulaşılamadığı için bu kritik ihlal bildirimi yedek e-posta ile
      gönderildi. İleti metni bildirimde yer almaz.
  some_digest_fallback:
    subject: Kritik ihlal günlük özeti
    intro: >-
      Olay takip sistemine ulaşılamadığı için yapay zekânın bulduğu güvenlik bulgularının günlük
      özeti yedek e-posta ile gönderildi. İleti metni özette yer almaz.
  labels:
    greeting: Merhaba,
    what_happened: Ne oldu
    why_it_matters: Neden önemli
    what_to_do: Ne yapmalısın
    details: Ayrıntılar
    record: Kayıt numarası
    device: Cihaz
    occurred_at: Olay zamanı (cihaz saatiyle)
    received_at: Merkeze ulaşma zamanı
    locations: Dosya ve satır
    event_type: Olay türü
    project: Proje
    fingerprint: Kurum hesabı parmak izi
    occurrences: Tekrar sayısı
    person_notification: Kişi bildirimi
    verification: Kayıt doğrulaması
    notification_id: Bildirim numarası
    day: Gün
    footer: >-
      Bu ileti otomatik gönderildi; yanıtlama. Kayıt numarası, olayın merkezdeki kaydını gösterir.
