# Chart defaults for the single-image deployment (API + UI in one container, SQLite on a volume).
# Project environment addressing (ingress host, TLS Secret name, storage class and size) belongs in
# the project-owned values-project.yaml beside this file, which deploy.sh layers on top.
app:
  # One pod only: SQLite lives on a ReadWriteOnce volume and the scheduler runs in-process.
  replicaCount: 1
  image:
    # Built by .github/workflows/image-build.yml (ghcr.io/<owner>/dwhcodereview-backend; the same image
    # is also published as -frontend for the deployment pipeline's wait step), pulled through the
    # internal registry mirror.
    repository: cr-test.kuveytturk.com.tr/ghcr.io.vc/kt-vibecoding/dwhcodereview-backend
    # deploy.sh sets the tag (IMAGE_TAG, default latest); a digest, when given, wins over the tag.
    tag: latest
    digest: ""
  # Matches the Dockerfile: uvicorn listens on 8080 and answers /api/health.
  port: 8080
  healthPath: /api/health
  # Extra non-secret environment variables for the container, e.g. {LOG_LEVEL: info}.
  env: {}
  # Pod network isolation (templates/networkpolicy.yaml). Inbound: only the ingress controller in
  # kube-system. Outbound: DNS here; the environment's LLM and SQL Server peers are listed in
  # values-project.yaml, which replaces this egress list as a whole.
  networkPolicy:
    ingress:
      - from:
          - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
        ports: [{protocol: TCP, port: 8080}]
    egress:
      - to:
          - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
            podSelector: {matchLabels: {k8s-app: kube-dns}}
        ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
  persistence:
    accessMode: ReadWriteOnce
    size: 1Gi
    storageClassName: ""
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 1000m, memory: 1Gi}

ingress:
  className: ""
  host: ""
  tlsSecretName: ""
